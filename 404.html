<!DOCTYPE html>
<html lang="ru" data-theme="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Ресурс не найден // ProTesla Labs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 6rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 0 25px var(--accent-glow);
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <div class="error-code">404</div>
    <h2 class="section-title">Запрашиваемый ресурс не обнаружен</h2>
    <p class="section-desc" style="margin-bottom: 2rem;">
      Маршрут не существует, был перемещен или заблокирован политиками безопасности сервера.
    </p>
    <a href="/" class="btn btn-primary">Вернуться на главную ProTesla Labs →</a>
  </div>
</body>
</html>
