# Default catch-all server block (redirects IP and unmapped hosts to canonical domain)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Drop or redirect direct IP requests to domain name
    return 301 http://protesla.online$request_uri;
}

# Redirect www to apex domain
server {
    listen 80;
    listen [::]:80;
    server_name www.protesla.online;

    return 301 http://protesla.online$request_uri;
}

# Main Server Block for Domain: protesla.online
server {
    listen 80;
    listen [::]:80;

    server_name protesla.online;
    root /var/www/portfolio;
    index index.html;
    charset utf-8;

    # Rate Limiting & Concurrency per IP
    limit_req zone=portfolio_req burst=40 nodelay;
    limit_conn portfolio_conn 20;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # Static Assets Caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Block access to hidden files and directories (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common malicious probes (PHP, WordPress, config files, backups)
    location ~* \.(php|aspx?|jsp|cgi|env|git|bak|sql|tar|gz|zip|yml|yaml|ini|conf)$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
