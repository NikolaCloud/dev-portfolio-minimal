# =========================================================================
# PROTESLA LABS // NGINX PRODUCTION SSL CONFIGURATION
# High-Performance HTTPS with HTTP/2, Let's Encrypt & Zero-Trust Hardening
# =========================================================================

# HTTP -> HTTPS Redirect (Port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name protesla.online www.protesla.online 201.58.186.138 _;

    # Allow ACME Challenge for Let's Encrypt certificate renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio;
        allow all;
        default_type "text/plain";
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://protesla.online$request_uri;
    }
}

# Redirect WWW HTTPS -> Apex HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.protesla.online;

    ssl_certificate /etc/letsencrypt/live/protesla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protesla.online/privkey.pem;

    return 301 https://protesla.online$request_uri;
}

# Main HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name protesla.online;
    root /var/www/portfolio;
    index index.html;
    charset utf-8;

    # SSL / TLS Modern Parameters
    ssl_certificate /etc/letsencrypt/live/protesla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protesla.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Rate Limiting & Concurrency per IP
    limit_req zone=portfolio_req burst=40 nodelay;
    limit_conn portfolio_conn 20;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # Static Assets Caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Block access to hidden files and directories (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common malicious probes (PHP, WordPress, config files, backups)
    location ~* \.(php|aspx?|jsp|cgi|env|git|bak|sql|tar|gz|zip|yml|yaml|ini|conf)$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
