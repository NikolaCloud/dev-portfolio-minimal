      <text x="165" y="10" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" text-anchor="end">65.8%</text>
    </g>
    <g transform="translate(0, 28)">
      <circle cx="6" cy="6" r="5" fill="#E34C26"/>
