      <rect x="244" y="0" width="65" height="10" fill="#E34C26"/>
      <rect x="309" y="0" width="42" height="10" fill="#F1E05A"/>
      <rect x="351" y="0" width="15" height="10" fill="#563D7C"/>
      <rect x="366" y="0" width="4" height="10" fill="#89E051"/>
    </g>
  </g>
  <!-- Legend Grid -->
  <g transform="translate(25, 85)">
