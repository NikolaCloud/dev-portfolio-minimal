      <text x="165" y="10" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" text-anchor="end">17.6%</text>
    </g>
    <g transform="translate(0, 56)">
      <circle cx="6" cy="6" r="5" fill="#F1E05A"/>
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#C9D1D9" font-weight="600">JavaScript</text>
      <text x="165" y="10" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" text-anchor="end">11.4%</text>
    </g>
