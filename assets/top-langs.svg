<svg width="420" height="195" viewBox="0 0 420 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="420" height="195" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
  <g transform="translate(25, 30)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">Most Used Languages</text>
