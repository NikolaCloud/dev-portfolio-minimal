<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Titanium & Iridium Metallic Gradients -->
    <linearGradient id="monolithMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="titaniumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Isometric Hexagonal Shield -->
  <polygon points="32,6 54,19 54,45 32,58 10,45 10,19" fill="#04060a" stroke="url(#monolithMetal)" stroke-width="1.8" filter="url(#titaniumGlow)"/>

  <!-- Isometric Three-Faceted Orthogonal Geometry -->
  <!-- Top Facet -->
  <polygon points="32,14 46,22 32,30 18,22" fill="url(#facetDark)" stroke="url(#monolithMetal)" stroke-width="1.2" opacity="0.95"/>
  <!-- Left Lower Facet -->
  <polygon points="18,22 32,30 32,48 18,39" fill="url(#facetMid)" stroke="url(#monolithMetal)" stroke-width="1.2" opacity="0.9"/>
  <!-- Right Lower Facet -->
  <polygon points="32,30 46,22 46,39 32,48" fill="#0b0f19" stroke="url(#monolithMetal)" stroke-width="1.2" opacity="0.9"/>

  <!-- Central Precision Core Singularity (Faceted Diamond Vertex) -->
  <polygon points="32,24 37,30 32,36 27,30" fill="url(#coreGlow)" stroke="#ffffff" stroke-width="1"/>
  <circle cx="32" cy="30" r="1.5" fill="#ffffff"/>

  <!-- Subtle Vertex Alignment Markers -->
  <circle cx="32" cy="14" r="1.2" fill="#cbd5e1"/>
  <circle cx="18" cy="22" r="1.2" fill="#cbd5e1"/>
  <circle cx="46" cy="22" r="1.2" fill="#cbd5e1"/>
  <circle cx="32" cy="48" r="1.2" fill="#cbd5e1"/>
</svg>
