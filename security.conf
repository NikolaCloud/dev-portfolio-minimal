# Global Security Settings & Rate Limiting
server_tokens off;

# Rate Limiting: 25 requests/sec per IP with 10MB state storage
limit_req_zone $binary_remote_addr zone=portfolio_req:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_conn:10m;

# Client Body & Buffer Limits (DDoS prevention)
client_body_buffer_size 128k;
client_max_body_size 10M;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;

# Timeouts to mitigate Slowloris attacks
client_body_timeout 10;
client_header_timeout 10;
keepalive_timeout 30;
send_timeout 10;
